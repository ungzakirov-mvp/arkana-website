<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="leftFace" x1="32" y1="6" x2="10" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="32" y1="6" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a5498"/>
      <stop offset="100%" stop-color="#1b2e68"/>
    </linearGradient>
    <linearGradient id="gem" x1="32" y1="37" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6baef6"/>
      <stop offset="100%" stop-color="#1a3ecc"/>
    </linearGradient>
    <linearGradient id="facet" x1="32" y1="28" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a8d0ff"/>
      <stop offset="100%" stop-color="#5090ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="#07090f"/>

  <!-- Left dark face of pyramid -->
  <polygon points="32,6 7,55 32,40" fill="url(#leftFace)"/>

  <!-- Right steel-blue face -->
  <polygon points="32,6 57,55 32,40" fill="url(#rightFace)"/>

  <!-- Center ridge -->
  <line x1="32" y1="6" x2="32" y2="40" stroke="#2c408a" stroke-width="0.8" opacity="0.7"/>

  <!-- Inner crystal/gem triangle -->
  <polygon points="32,37 21,55 43,55" fill="url(#gem)"/>

  <!-- Gem facet highlight (upper bright area) -->
  <polygon points="32,28 26,40 38,40" fill="url(#facet)" opacity="0.72"/>

  <!-- Top apex glint -->
  <polygon points="32,6 30.5,16 33.5,16" fill="#c8e2ff" opacity="0.38"/>
</svg>

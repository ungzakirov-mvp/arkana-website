version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Batch minor/patch updates for low-risk packages
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss*"
          - "tw-animate-css"
    ignore:
      # Don't auto-update Next.js major — requires manual testing
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # Don't auto-update React major
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
